<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY Todo App</title>

    <!-- CSS -->
     <link rel="stylesheet" href="style1.css">

     <!-- Font Awesome -->
       <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    >
</head>
<body>
    
<div class="container">
<!-- Header -->
 <header>
    <h1>My Tasks</h1>
    <p>Organize your day, one task at a time.</p>
 </header>

 <!-- Add Task Section -->
  <div class="input-section">
    <input type="text" id="taskInput" placeholder="What needs to be done?">
    <button id="addBtn">
        <i class="fa-solid fa-plus"></i> 
        Add Task
    </button>
  </div>

  <!-- Task Statistics -->
   <div class="task-stats">

    <div class="stat-card">
        <h2 id="totalTask">0</h2>
        <p>Total Task</p>
    </div>

<div class="stat-card"><h2 id="CompletedTask">0</h2>
<p>Completed</p></div>

<div class="stat-card"><h2 id="pendingTask">0</h2>
<p>Pending</p></div>

   </div>

   <!-- Task List Section -->
    <section class="task-section">
        <div class="section-heading">
            <h2>Today's Tasks</h2>
            <span id="taskCount">0 Tasks</span>
        </div>

        <!-- JS will add task here -->
         <div class="task-list" id="task-list">
            <p class="empty-message">No tasks yet. Add your first task.</p>
         </div>
    </section>

    <!-- Footer -->
     <footer>
        <p>Stay focused. Keep making progres. 🚀</p>
     </footer>


</div>

<!-- Javascript -->
 <script src="script.js"></script>

</body>
</html>
